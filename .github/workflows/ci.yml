name: SentinelForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint repository for fatal errors
        run: |
          ruff check . --select=E9,F63,F7,F82 \
            --exclude=output/builds/src/hardware/ascom_hal.py

      - name: Run test suite
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q

      - name: Run end-to-end pipeline test
        env:
          PYTHONIOENCODING: utf-8
        run: python end_to_end_test.py

      - name: Run science module self-tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd output/builds/src/science
          python light_curve_analyzer.py
          python graph_associator.py
          python bayesian_iod.py
          python koopman_propagator.py
          python cislunar_dynamics.py
          python data_assimilation_engine.py

      - name: Verify main.py entry point
        env:
          PYTHONIOENCODING: utf-8
        run: python main.py

  cmake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CMakeLists.txt parses
        run: |
          cd output/builds/src
          if cmake -B build -DCMAKE_CUDA_ARCHITECTURES=87 >cmake.log 2>&1; then
            cat cmake.log
          elif grep -Eq "Failed to find nvcc|Could not find nvcc|No CMAKE_CUDA_COMPILER" cmake.log; then
            cat cmake.log
            echo "CMake parse check complete (CUDA toolkit not installed — expected)"
          else
            cat cmake.log
            exit 1
          fi
